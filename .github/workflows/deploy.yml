name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: template-devstarter/package-lock.json

      - name: Install dependencies
        working-directory: template-devstarter
        run: npm ci

      - name: Build
        working-directory: template-devstarter
        run: npm run build

      - name: Verify index.html
        run: |
          echo "Checking output..."
          ls -la template-devstarter/out
          test -f template-devstarter/out/index.html
          echo "index.html found!"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: template-devstarter/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4